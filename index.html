<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Video Library | Japan Home Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fafafa;
  color: #333;
}

nav {
  background: #111;
  padding: 12px 20px;
}
nav a {
  color: white;
  text-decoration: none;
  font-size: 14px;
}

header {
  text-align: center;
  padding: 40px 20px;
}
header h1 {
  margin: 0;
}
header p {
  color: #666;
}

/* ライブラリー */
.library {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
}

.video {
  aspect-ratio: 9 / 16;
  background: #000;
  border-radius: 16px;
  overflow: hidden;
}

.video iframe {
  width: 100%;
  height: 100%;
  border: none;
}

footer {
  text-align: center;
  padding: 20px;
  font-size: 14px;
  color: #777;
}
</style>
</head>

<body>

<nav>
  <a href="/">← Home</a>
</nav>

<header>
  <h1>Video Library</h1>
  <p>Japan Home Lab – Shorts & Experiments</p>
</header>

<section class="library">

  <div class="video">
    <iframe src="https://www.youtube.com/embed/VQ23iGFw7UE"></iframe>
  </div>

  <div class="video">
    <iframe src="https://www.youtube.com/embed/s-PIxNNfZ2o"></iframe>
  </div>

  <div class="video">
    <iframe src="https://www.youtube.com/embed/eGnySFDVwFw"></iframe>
  </div>

  <!-- 追加はここにコピペ -->
</section>

<footer>
  © 2025 JapanHomeLab
</footer>

</body>
</html>
